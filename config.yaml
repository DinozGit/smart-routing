api_blacklist:
  - gpt-3.5
  - gpt-3.5-turbo
  - claude-2
  - claude-2.0
  - claude-2.1
  - gemini-pro
  - gpt-4-turbo-preview
  - gpt-4-32k
  - text-davinci

logging:
  level: INFO
  max_entries: 500

models:
  routerai::deepseek/deepseek-v4-flash:
    emoji: ⚡
    input_price: 9.157
    output_price: 18.3141
    provider: RouterAI
    role: Worker
    currency: RUB
  routerai::deepseek/deepseek-v4-pro:
    emoji: 🧠
    input_price: 61.9626
    output_price: 123.9251
    provider: RouterAI
    role: Coordinator
    currency: RUB
  routerai::qwen/qwen3-coder-next:
    emoji: 💻
    input_price: 11.1919
    output_price: 81.3958
    provider: RouterAI
    role: Frontend
    currency: RUB
  routerai::z-ai/glm-5.2:
    emoji: 🧪
    input_price: 94.6226
    output_price: 305.2343
    provider: RouterAI
    role: Coordinator
    currency: RUB
  # Пример override'а только для одного провайдера (цена в валюте этого провайдера):
  # openrouter::deepseek/deepseek-v4-pro:
  #   input_price: 1.6
  #   output_price: 4.8
  #   currency: USD

providers:
  routerai:
    display_name: RouterAI
    base_url: https://routerai.ru/api/v1/chat/completions
    models_endpoint: https://routerai.ru/api/v1/models
    api_key_env: ROUTERAI_KEY
    requires_api_key: true
    pricing_mode: auto
    default: true
    verify_ssl: true
    ca_bundle: ""
    extra_headers: {}
  openrouter:
    display_name: OpenRouter
    base_url: https://openrouter.ai/api/v1/chat/completions
    models_endpoint: https://openrouter.ai/api/v1/models
    api_key_env: OPENROUTER_API_KEY
    requires_api_key: true
    pricing_mode: auto
    default: false
    verify_ssl: true
    ca_bundle: ""
    extra_headers:
      HTTP-Referer: https://github.com/smart-routing/smart-router
      X-Title: SmartRouter
  ollama:
    display_name: Ollama (local)
    base_url: http://localhost:11434/v1/chat/completions
    models_endpoint: http://localhost:11434/api/tags
    api_key_env: ""
    requires_api_key: false
    pricing_mode: free
    default: false
    verify_ssl: true
    ca_bundle: ""
    extra_headers: {}

currency:
  base: RUB
  usd_rate: 90.0        # 1 USD = 90 ₽ (RUB за 1 USD)

roles:
  coordinator:
    name: "🧠 Coordinator"
    description: "Сложные задачи, код-ревью, архитектура"
    default_model: "deepseek/deepseek-v4-pro"
    agents:
      - coordinator
    capabilities:
      tools: true
      images: false
      max_tokens: 1048576
  worker_default:
    name: "⚡ Worker (default)"
    description: "Технические задачи — database, api, tests, bot, services, devops"
    default_model: "deepseek/deepseek-v4-flash"
    agents:
      - database
      - tests
      - bot
      - api
      - services
      - devops
    capabilities:
      tools: true
      images: false
      max_tokens: 1048576
  worker_img:
    name: "🖼️ Worker Img"
    description: "Задачи с изображениями — frontend, mobile, design"
    default_model: "qwen/qwen3-coder-next"
    agents:
      - frontend
      - mobile
      - design
    capabilities:
      tools: true
      images: true
      max_tokens: 262144

server:
  admin_host: 127.0.0.1
  admin_port: 8766
  router_port: 8765
  single_port: true